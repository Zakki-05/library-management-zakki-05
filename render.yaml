services:
  - type: web
    name: library-management-system
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: ALLOWED_HOSTS
        value: "*"

databases:
  - name: library-db
    databaseName: library_db
    user: library_admin
    plan: free
