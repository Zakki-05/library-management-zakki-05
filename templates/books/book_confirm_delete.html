{% extends 'base.html' %}

{% block title %}Delete Book{% endblock %}
{% block page_title %}Delete Book{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card p-5 text-center border-danger" style="border-width: 2px;">
            <i class="fa-solid fa-triangle-exclamation fa-4x text-danger mb-4"></i>
            <h3 class="fw-bold mb-3">Confirm Deletion</h3>
            <p class="mb-4">Are you sure you want to delete the book <strong>"{{ book.title }}"</strong>? This action cannot be undone.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                    <a href="{% url 'books:detail' book.pk %}" class="btn btn-light px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
