{% extends 'base.html' %}

{% block title %}Password Reset Complete{% endblock %}
{% block page_title %}Reset Complete{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="glass-card p-5">
            <i class="fa-solid fa-circle-check fa-4x text-success mb-4"></i>
            <h3 class="fw-bold mb-3">Password Changed!</h3>
            <p class="text-muted mb-4">Your password has been set. You may go ahead and log in now.</p>
            <a href="{% url 'login' %}" class="btn btn-primary-custom">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
