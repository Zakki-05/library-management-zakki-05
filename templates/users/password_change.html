{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-5">
            <div class="text-center mb-4">
                <div class="stat-icon mx-auto mb-3" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(99, 102, 241, 0.05)); color: var(--primary-color);">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h3 class="fw-bold">Security</h3>
                <p class="text-muted">Update your account password</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary-custom btn-lg">Update Password</button>
                </div>
                <div class="text-center mt-3">
                    <a href="{% url 'profile' %}" class="text-muted text-decoration-none small">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to Profile
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
