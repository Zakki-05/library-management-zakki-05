{% extends 'base.html' %}

{% block title %}Contact Us{% endblock %}
{% block page_title %}Contact Us{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="glass-card p-5">
            <div class="text-center mb-5">
                <h3 class="fw-bold">Get in Touch</h3>
                <p class="text-muted">Have a question or need assistance? Fill out the form below.</p>
            </div>
            <form>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" placeholder="Your Name">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Your Email">
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="5" placeholder="How can we help?"></textarea>
                    </div>
                    <div class="col-12 text-center mt-3">
                        <button type="button" class="btn btn-primary-custom px-5 py-2">Send Message</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
